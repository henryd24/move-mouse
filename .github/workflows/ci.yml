name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            app/go.sum

      - name: Herramientas (Windows)
        if: runner.os == 'Windows'
        run: choco install make zip -y --no-progress

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev libx11-dev xorg-dev libxtst-dev libpng-dev \
            libxcb-xkb-dev x11-xkb-utils libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev xsel xclip \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Lint
        if: runner.os == 'Linux'
        run: make lint

      - name: Test
        run: make test

      - name: Build CLI
        shell: bash
        run: make build

      - name: Build GUI
        shell: bash
        run: make gui-build
