name: Release

# Crea un release al subir un tag: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    goos: linux,   goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux,   goarch: arm64 }
          - { os: macos-15-intel,   goos: darwin,  goarch: amd64 }
          - { os: macos-latest,     goos: darwin,  goarch: arm64 }
          - { os: windows-latest,   goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            app/go.sum

      - name: Herramientas (Windows)
        if: runner.os == 'Windows'
        run: choco install make zip -y --no-progress

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev libx11-dev xorg-dev libxtst-dev libpng-dev \
            libxcb-xkb-dev x11-xkb-utils libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev xsel xclip \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test
        run: make test

      - name: Empaquetar CLI y GUI
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          make package gui-package VERSION="$VERSION"

      - name: Paquetes .deb/.rpm
        if: runner.os == 'Linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          VERSION="${GITHUB_REF_NAME:-dev}"
          make deb rpm VERSION="$VERSION" PATH="$PATH:$(go env GOPATH)/bin"
          cd dist && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: move-mouse-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums unificados
        run: cd dist && cat *.sha256 > SHA256SUMS && ls -l

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
